<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify — Real-Time Chat Test Client</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header .badge {
            background: #10b981;
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 320px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            font-size: 14px;
            padding: 16px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .setup-panel {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid #334155;
        }

        .setup-panel label {
            font-size: 12px;
            color: #94a3b8;
        }

        .setup-panel input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .setup-panel input:focus {
            border-color: #6366f1;
        }

        .setup-panel button {
            background: #6366f1;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .setup-panel button:hover {
            background: #4f46e5;
        }

        .setup-panel button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .status {
            font-size: 12px;
            padding: 8px 16px;
        }

        .status.connected {
            color: #10b981;
        }

        .status.disconnected {
            color: #ef4444;
        }

        .conv-input {
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #334155;
        }

        .conv-input input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .conv-input button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        /* ── Chat Area ── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #1e293b;
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            font-weight: 600;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.sent {
            background: #6366f1;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: #334155;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message .meta {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        .message.received .meta {
            color: #94a3b8;
        }

        .typing-indicator {
            font-size: 12px;
            color: #94a3b8;
            padding: 0 24px 8px;
            min-height: 24px;
        }

        .message-input {
            display: flex;
            gap: 8px;
            padding: 16px 24px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        .message-input input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .message-input input:focus {
            border-color: #6366f1;
        }

        .message-input button {
            background: #6366f1;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        /* ── Event Log ── */
        .event-log {
            width: 320px;
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .event-log h2 {
            font-size: 14px;
            padding: 16px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #334155;
        }

        .events {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 11px;
        }

        .event-entry {
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .event-entry.emit {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
        }

        .event-entry.receive {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
        }

        .event-entry.system {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
        }

        .event-entry .time {
            color: #64748b;
            margin-right: 6px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🔌 Eventify Real-Time Chat Test Client</h1>
        <span class="badge" id="connectionBadge">Disconnected</span>
    </div>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Connection</h2>
            <div class="setup-panel">
                <label>Server URL</label>
                <input type="text" id="serverUrl" value="http://localhost:8000" />
                <label>JWT Access Token</label>
                <input type="text" id="jwtToken" placeholder="Paste your JWT here" />
                <label>CSRF Token</label>
                <input type="text" id="csrfToken" placeholder="Paste CSRF token here" />
                <button id="connectBtn">Connect</button>
            </div>
            <div id="statusBar" class="status disconnected">● Disconnected</div>

            <h2>Conversation</h2>
            <div class="conv-input">
                <input type="number" id="convId" placeholder="Conversation ID" />
                <button id="joinBtn">Join</button>
            </div>
            <div class="conv-input">
                <button id="leaveBtn" style="width:100%">Leave Conversation</button>
            </div>
            <div class="conv-input">
                <button id="markReadBtn" style="width:100%; background:#10b981">Mark as Read (REST)</button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">No conversation joined</div>
            <div class="messages" id="messagesContainer"></div>
            <div class="typing-indicator" id="typingIndicator"></div>
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Type a message..." />
                <button id="sendBtn">Send</button>
            </div>
        </div>

        <!-- Event Log -->
        <div class="event-log">
            <h2>Event Log</h2>
            <div class="events" id="eventLog"></div>
        </div>
    </div>

    <script src="/socket.io.min.js"></script>
    <script src="/test-chat.js"></script>
</body>

</html>
